databases:
  - name: grejtu-crm-db
    databaseName: crm
    plan: free
    region: frankfurt

services:
  - type: web
    name: grejtu-crm-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: grejtu-crm-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          name: grejtu-crm-web
          type: web
          property: host
    healthCheckPath: /health

  - type: web
    name: grejtu-crm-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: grejtu-crm-api
          type: web
          property: host
